services:
  # --- Infrastructure ---
  config-server:
    image: n11-clone/config-server:latest
    container_name: config-server
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=native
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8762/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n11-network

  discovery-server:
    image: n11-clone/discovery-server:latest
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - CONFIG_URI=http://config-server:8762
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n11-network

  api-gateway:
    image: n11-clone/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8763:8763"
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-change-me-32-bytes-minimum}
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - n11-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n11-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - n11-network

  # --- Databases ---
  user-db:
    image: postgres:latest
    container_name: user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: user-db
    ports:
      - "5434:5432"
    volumes:
      - user_db_data:/var/lib/postgresql
    networks:
      - n11-network

  product-db:
    image: postgres:latest
    container_name: product-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: product-db
    ports:
      - "5435:5432"
    volumes:
      - product_db_data:/var/lib/postgresql
    networks:
      - n11-network

  cart-db:
    image: postgres:latest
    container_name: cart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: cart-db
    ports:
      - "5436:5432"
    volumes:
      - cart_db_data:/var/lib/postgresql
    networks:
      - n11-network

  order-db:
    image: postgres:latest
    container_name: order-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: order-db
    ports:
      - "5437:5432"
    volumes:
      - order_db_data:/var/lib/postgresql
    networks:
      - n11-network

  stock-db:
    image: postgres:latest
    container_name: stock-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: n11bootcamp
    ports:
      - "5438:5432"
    volumes:
      - stock_db_data:/var/lib/postgresql
    networks:
      - n11-network

  # --- Business Services ---
  user-service:
    image: n11-clone/user-service:latest
    container_name: user-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/user-db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-1234}
    depends_on:
      discovery-server:
        condition: service_healthy
      user-db:
        condition: service_started
    networks:
      - n11-network

  product-service:
    image: n11-clone/product-service:latest
    container_name: product-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://product-db:5432/product-db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-1234}
    depends_on:
      discovery-server:
        condition: service_healthy
      product-db:
        condition: service_started
    networks:
      - n11-network

  shopping-cart-service:
    image: n11-clone/shopping-cart-service:latest
    container_name: shopping-cart-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cart-db:5432/cart-db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-1234}
    depends_on:
      discovery-server:
        condition: service_healthy
      cart-db:
        condition: service_started
    networks:
      - n11-network

  order-service:
    image: n11-clone/order-service:latest
    container_name: order-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order-db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASSWORD=${RABBIT_PASSWORD:-guest}
    depends_on:
      discovery-server:
        condition: service_healthy
      order-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      payment-service:
        condition: service_started
    networks:
      - n11-network

  payment-service:
    image: n11-clone/payment-service:latest
    container_name: payment-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - PAYMENT_MOCK_FORCE_FAILURE=false
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - n11-network

  stock-service:
    image: n11-clone/stock-service:latest
    container_name: stock-service
    environment:
      - CONFIG_URI=http://config-server:8762
      - EUREKA_URI=http://discovery-server:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stock-db:5432/n11bootcamp
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASSWORD=${RABBIT_PASSWORD:-guest}
    depends_on:
      discovery-server:
        condition: service_healthy
      stock-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - n11-network
      
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - n11-network

volumes:
  user_db_data:
  product_db_data:
  cart_db_data:
  order_db_data:
  stock_db_data:

networks:
  n11-network:
    driver: bridge
