spring.application.name=api-gateway
server.port=8763

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Config Server
spring.cloud.config.uri=http://localhost:8762

# Spring Cloud Gateway
spring.cloud.gateway.discovery.locator.enabled=true

# Gateway Routes
spring.cloud.gateway.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.routes[1].id=SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].uri=lb://SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/shopping-cart/**

spring.cloud.gateway.routes[2].id=USER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/user/**

spring.cloud.gateway.routes[3].id=ORDER-SERVICE
spring.cloud.gateway.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[4].id=STOCK-SERVICE
spring.cloud.gateway.routes[4].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/stocks/**

spring.cloud.gateway.routes[5].id=PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.routes[5].uri=lb://PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/feign-client/**
