# =========================
# API Gateway - application.properties
# =========================
spring.application.name=api-gateway
server.port=8763

# Profiles
spring.profiles.active=local
spring.profiles.include=native

# -------------------------
# Config Server (env ile override edilebilir)
# - Docker i�inde: CONFIG_URI=http://config-server:8762
# - Lokal: fallback http://localhost:8762
# -------------------------
spring.cloud.config.uri=${CONFIG_URI:http://localhost:8762}
spring.config.import=optional:configserver:${CONFIG_URI:http://localhost:8762}

# -------------------------
# Eureka (env ile override edilebilir)
# - Docker i�inde: EUREKA_URI=http://discorvery-server:8761/eureka
# - Lokal: fallback http://localhost:8761/eureka
# -------------------------
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# -------------------------
# Spring Cloud Gateway discovery locator
# - Docker ortaminnda true yapmak istersin (env ile)
# - Lokalda default false (deadlock onlemek icin)
# -------------------------
spring.cloud.gateway.discovery.locator.enabled=${GATEWAY_DISCOVERY_ENABLED:false}
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# -------------------------
# Other
# -------------------------
spring.main.allow-bean-definition-overriding=true
spring.cloud.compatibility-verifier.enabled=false

# JWT / refresh token settings
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-32-bytes-minimum}
jwt.issuer=${JWT_ISSUER:n11-clone}
jwt.validity-ms=${JWT_VALIDITY_MS:900000}
refresh-token.validity-ms=${REFRESH_TOKEN_VALIDITY_MS:1209600000}
refresh-token.redis-prefix=${REFRESH_TOKEN_REDIS_PREFIX:n11:refresh-token}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# -------------------------
# Gateway Routes
# -------------------------
spring.cloud.gateway.server.webmvc.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=SHOPPING-CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://SHOPPING-CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/shopping-cart/**

spring.cloud.gateway.server.webmvc.routes[2].id=PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/feign-client/**


spring.cloud.gateway.server.webmvc.routes[3].id=ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**



spring.cloud.gateway.server.webmvc.routes[4].id=USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/user/**

spring.cloud.gateway.server.webmvc.routes[5].id=STOCK-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://STOCK-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/stocks/**

spring.cloud.gateway.server.webmvc.routes[6].id=PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/payments/**

# -------------------------
# Swagger/OpenAPI Aggregation
# -------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/api/product/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/api/orders/v3/api-docs
springdoc.swagger-ui.urls[2].name=User Service
springdoc.swagger-ui.urls[2].url=/api/user/v3/api-docs
springdoc.swagger-ui.urls[3].name=Shopping Cart Service
springdoc.swagger-ui.urls[3].url=/api/shopping-cart/v3/api-docs
springdoc.swagger-ui.urls[4].name=Stock Service
springdoc.swagger-ui.urls[4].url=/api/stocks/v3/api-docs
springdoc.swagger-ui.urls[5].name=Payment Service
springdoc.swagger-ui.urls[5].url=/api/payments/v3/api-docs
